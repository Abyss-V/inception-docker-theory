services:
    backup:
      build:
        context: ./requirements/bonus/backup
      image: backup:inception
      container_name: backup
      environment:
          - MYSQL_USER=${MYSQL_USER}
          - MYSQL_DATABASE=${MYSQL_DATABASE}
        
      networks:
        - app_network
      restart: on-failure
      secrets:
        - db_password
      volumes:
          - backup-data:/backup
    static:
      build:
        context: ./requirements/bonus/static
      image: static:inception
      container_name: static
      restart: on-failure
      ports:
        - "8081:8081"
    ftp:
      build:
        context: ./requirements/bonus/ftp
      image: ftp:inception
      container_name: ftp
      environment:
          - FTP_USER=${FTP_USER}
      networks:
        - app_network
      restart: on-failure
      secrets:
        - ftp_password
      volumes:
          - wordpress-data:/var/www/html
      ports:
        - "21:21"
        - "21100-21110:21100-21110"
    adminer:
      build:
        context: ./requirements/bonus/adminer
      image: adminer:inception
      container_name: adminer
      networks:
        - app_network
      restart: on-failure
      ports:
        - "8080:8080"
    redis:
      build:
        context: ./requirements/bonus/redis
      image: redis:inception
      container_name: redis
      networks:
        - app_network
      restart: on-failure
    mariadb:
        build: 
          context: ./requirements/mariadb
        image: mariadb:inception
        container_name: mariadb
        environment:
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - MYSQL_USER=${MYSQL_USER}
        restart: on-failure
        networks:
          - app_network
        secrets:
          - db_password
          - db_root_password
        volumes:
        - mariadb-data:/var/lib/mysql
    wordpress:
        build: 
          context: ./requirements/wordpress
        image: wordpress:inception
        container_name: wordpress
        depends_on:
          - mariadb
          - redis
        restart: on-failure
        environment:
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - MYSQL_USER=${MYSQL_USER}
            - WP_ADMIN_USER=${WP_ADMIN_USER}
            - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
            - WP_USER=${WP_USER}
            - WP_USER_EMAIL=${WP_USER_EMAIL}
            - WP_TITLE=${WP_TITLE}
            - DOMAIN_NAME=${DOMAIN_NAME} 
        networks:
          - app_network
        secrets:
          - db_password
          - source: wp_admin_password
            target: /run/secrets/wp_admin_password.txt
          - source: wp_user_password
            target: /run/secrets/wp_user_password.txt
        volumes:
          - wordpress-data:/var/www/html

    nginx:
        build: 
          context: ./requirements/nginx
        image: nginx:inception
        restart: on-failure
        networks:
          - app_network
        container_name: nginx
        depends_on:  
          - wordpress
        ports: 
          - "443:443"
        volumes:
          - wordpress-data:/var/www/html:ro

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt

volumes:
  backup-data:
  wordpress-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ymouhib/data/wordpress
  mariadb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ymouhib/data/mariadb

networks:
  app_network: 
    driver: bridge